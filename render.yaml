services:
  - type: web
    name: netqos-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ROUTER_HOST
        value: "0.0.0.0"
      - key: FORWARD_HOST
        value: "127.0.0.1"
