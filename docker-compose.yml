services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netqos-backend
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9001:9001/udp"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - PYTHONUNBUFFERED=1
      - ROUTER_HOST=0.0.0.0
      - FORWARD_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - netqos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netqos-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps with hot-reloading in Docker on Windows
    networks:
      - netqos-network

networks:
  netqos-network:
    driver: bridge
